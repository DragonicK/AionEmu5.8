dependencies {
    implementation 'com.jolbox:bonecp:0.7.1.RELEASE'
    implementation 'com.mchange:c3p0:0.9.1.1'
    implementation 'cglib:cglib-nodep:2.2'
    implementation 'commons-io:commons-io:2.4'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'com.google.guava:guava:13.0.1'
    implementation 'org.hamcrest:hamcrest-all:1.3'
    implementation 'org.javassist:javassist:3.15.0-GA'
    implementation 'org.javolution:javolution:5.5.1'
    implementation 'joda-time:joda-time:2.1'
    implementation 'net.sourceforge.jsr166-mirror:jsr166:1.0.0'
    implementation 'com.google.code.findbugs:jsr305:2.0.1'
    implementation 'ch.lambdaj:lambdaj:2.4'
    implementation 'ch.qos.logback:logback-classic:1.1.2'
    implementation 'ch.qos.logback:logback-core:1.1.2'
    implementation 'mysql:mysql-connector-java:5.1.33'
    implementation 'org.objenesis:objenesis:1.2'
    implementation 'org.quartz-scheduler:quartz:2.1.7'
    implementation 'org.slf4j:slf4j-api:1.6.4'
    implementation 'net.sf.trove4j:trove4j:3.0.3'
    implementation 'xerces:xercesImpl:2.8.1'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.4'
    testImplementation 'junit:junit:4.11'
}

jar {
    archiveBaseName = 'al-commons'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

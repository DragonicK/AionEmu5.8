dependencies {
    implementation project(':AL-Commons')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

jar {
    archiveBaseName = 'AC-Chat'
    manifest {
        attributes(
            'Main-Class': 'com.aionemu.chatserver.ChatServer'
        )
    }
}
